name: Cloudflare custom domain

# One-time setup (re-runnable): attaches nfl.gmgsports.org to the gmg-nfl
# Cloudflare Pages project, then prints the domain's verification status.
# Runs when this file changes or from the Actions tab. The DNS side (the
# "nfl" CNAME at Namecheap -> gmg-nfl.pages.dev) is done by hand at
# Namecheap; Cloudflare finishes verifying on its own once that's in place.
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cloudflare-domain.yml"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  domain:
    runs-on: ubuntu-latest
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      API: https://api.cloudflare.com/client/v4/accounts/${{ secrets.CLOUDFLARE_ACCOUNT_ID }}/pages/projects/gmg-nfl/domains
    steps:
      - name: Attach nfl.gmgsports.org (already attached is fine)
        run: |
          resp=$(curl -s -X POST "$API" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data '{"name":"nfl.gmgsports.org"}')
          echo "$resp" | jq '{success, errors, status: .result.status}'
          echo "$resp" | jq -e '.success or (.errors | tostring | test("already"; "i"))' > /dev/null

      - name: Domain status
        run: |
          curl -s "$API" -H "Authorization: Bearer $CF_TOKEN" | jq '.result[]? | {name, status, validation: .validation_data.status, verification: .verification_data.status}'
